apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ include "finmind.namespace" . }}
  labels:
    app: backend
    {{- include "finmind.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: {{ .Values.observability.prometheusScrape | quote }}
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ .Values.backend.service.port | quote }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: POSTGRES_DB
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: JWT_SECRET
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: GEMINI_API_KEY
            - name: DATABASE_URL
              value: postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: finmind-config
                  key: REDIS_URL
            - name: GEMINI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: finmind-config
                  key: GEMINI_MODEL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: finmind-config
                  key: LOG_LEVEL
          command:
            - sh
            - -c
            - |
              python -m flask --app wsgi:app init-db && \
              export PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc && \
              rm -rf $PROMETHEUS_MULTIPROC_DIR && \
              mkdir -p $PROMETHEUS_MULTIPROC_DIR && \
              gunicorn --workers=2 --threads=4 --bind 0.0.0.0:8000 wsgi:app
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ include "finmind.namespace" . }}
  labels:
    app: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app: backend
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
