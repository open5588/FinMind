namespace: finmind

global:
  environment: production

backend:
  replicaCount: 2
  image:
    repository: ghcr.io/rohitdash08/finmind-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/rohitdash08/finmind-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 1

postgres:
  enabled: true
  image: postgres:16
  storage: 10Gi
  service:
    port: 5432

redis:
  enabled: true
  image: redis:7
  service:
    port: 6379

config:
  logLevel: INFO
  geminiModel: gemini-1.5-flash
  redisUrl: redis://redis:6379/0

secrets:
  create: true
  name: finmind-secrets
  postgresUser: finmind
  postgresPassword: change-me-postgres-password
  postgresDb: finmind
  jwtSecret: change-me-jwt-secret-with-32-plus-bytes
  geminiApiKey: ""

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    api: api.finmind.local
    app: app.finmind.local
  tls:
    enabled: true
    secretName: finmind-tls-secret

networkPolicy:
  enabled: true

observability:
  enabled: true
  prometheusScrape: true
