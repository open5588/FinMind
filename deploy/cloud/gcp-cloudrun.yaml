apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: finmind-backend
spec:
  template:
    spec:
      containers:
        - image: ghcr.io/rohitdash08/finmind-backend:latest
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
