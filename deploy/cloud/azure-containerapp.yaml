type: Microsoft.App/containerApps
name: finmind-backend
properties:
  configuration:
    ingress:
      external: true
      targetPort: 8000
  template:
    containers:
      - name: backend
        image: ghcr.io/rohitdash08/finmind-backend:latest
        resources:
          cpu: 0.5
          memory: 1Gi
    scale:
      minReplicas: 1
      maxReplicas: 5
