app = "finmind-api"
primary_region = "iad"

[build]
  dockerfile = "packages/backend/Dockerfile"

[deploy]
  release_command = "python -m flask --app wsgi:app init-db"

[env]
  PORT = "8000"
  LOG_LEVEL = "INFO"
  GEMINI_MODEL = "gemini-1.5-flash"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
